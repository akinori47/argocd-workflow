apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: tier0-addons
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  description: "Tier 0: System & Cluster Infrastructure Addons (Gateway API, Ingress, Monitoring, Node Agents)"
  sourceRepos:
    - "https://github.com/akinori47/argocd-workflow.git"
    - "https://kubernetes.github.io/ingress-nginx"
    - "https://prometheus-community.github.io/helm-charts"
    - "docker.io/envoyproxy/*"
    - "https://helm.envoyproxy.io"
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
