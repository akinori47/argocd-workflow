apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - target:
      kind: ApplicationSet
      name: cluster-addons
    patch: |-
      - op: replace
        path: /metadata/name
        value: test-cluster-addons
      - op: replace
        path: /spec/generators/0/merge/generators/1/git/files/0/path
        value: clusters/environments/test/addons/*/addon.yaml
      - op: replace
        path: /spec/template/metadata/name
        value: test-addon-{{.addon}}
      - op: replace
        path: /spec/template/metadata/annotations/argocd.argoproj.io~1manifest-generate-paths
        value: /clusters/base/addons/{{.addon}};/clusters/environments/test/addons/{{.addon}}
      - op: replace
        path: /spec/template/metadata/labels/environment
        value: test
      - op: replace
        path: /spec/template/spec/sources/1/helm/valueFiles/1
        value: $values/clusters/environments/test/addons/{{.addon}}/values.yaml
      - op: replace
        path: /spec/templatePatch
        value: |
          {{- if eq .kustomize "true" }}
          spec:
            sources:
              - repoURL: https://github.com/akinori47/argocd-workflow.git
                targetRevision: HEAD
                ref: values
              - repoURL: '{{.chart.repoURL}}'
                chart: '{{.chart.name}}'
                targetRevision: '{{.chart.version}}'
                helm:
                  releaseName: '{{.addon}}'
                  ignoreMissingValueFiles: true
                  valueFiles:
                    - '$values/clusters/base/addons/{{.addon}}/common-values.yaml'
                    - '$values/clusters/environments/test/addons/{{.addon}}/values.yaml'
              - repoURL: https://github.com/akinori47/argocd-workflow.git
                targetRevision: HEAD
                path: 'clusters/environments/test/addons/{{.addon}}'
          {{- end }}
