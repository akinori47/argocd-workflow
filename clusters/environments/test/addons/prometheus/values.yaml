server:
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

extraManifests:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: prometheus-custom-config
      namespace: monitoring
    data:
      custom-parameter: "test-value-123"
      description: "Custom companion ConfigMap in test prometheus overlay"
