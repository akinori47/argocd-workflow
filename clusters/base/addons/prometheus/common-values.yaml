# Global DRY defaults for Prometheus
alertmanager:
  enabled: false
kube-state-metrics:
  enabled: true
prometheus-node-exporter:
  # Managed as a standalone addon
  enabled: false
prometheus-pushgateway:
  enabled: false
server:
  global:
    scrape_interval: 30s
    evaluation_interval: 30s
  persistentVolume:
    enabled: false
